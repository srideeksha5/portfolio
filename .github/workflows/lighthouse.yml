name: Lighthouse Website Audit

on:
  pull_request:
    branches: ["develop"]

  workflow_dispatch:

  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  lighthouse:
    name: Audit Portfolio
    runs-on: ubuntu-latest

    steps:
      - name: Run Lighthouse Audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://srideeksha5.github.io/portfolio/
          runs: 3
          uploadArtifacts: true
          temporaryPublicStorage: true