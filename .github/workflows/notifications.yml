name: CI Notifications

on:
  workflow_run:
    workflows:
      - HTML Validation
      - Lighthouse Website Audit
      - Deploy Portfolio
      - Pull Request Checks
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  notification:
    runs-on: ubuntu-latest

    steps:
      - name: Report workflow result
        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_STATUS: ${{ github.event.workflow_run.conclusion }}
          BRANCH_NAME: ${{ github.event.workflow_run.head_branch }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          echo "## CI Workflow Notification" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Workflow:** $WORKFLOW_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "**Status:** $WORKFLOW_STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** $BRANCH_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** $COMMIT_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "**Run:** $RUN_URL" >> "$GITHUB_STEP_SUMMARY"

          if [ "$WORKFLOW_STATUS" = "success" ]; then
            echo "Workflow completed successfully."
          else
            echo "Workflow failed or was cancelled."
          fi