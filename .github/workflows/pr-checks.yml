name: Pull Request Checks

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  pr-checks:
    name: PR Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display repository structure
        run: |
          pwd
          ls -la
          find . -maxdepth 2 -type f

      - name: Check website files
        run: |
          test -f ./index.html
          test -d ./css
          test -d ./images
          test -d ./js

      - name: Check required workflow files
        run: |
          test -f .github/workflows/validate.yml
          test -f .github/workflows/lighthouse.yml
          test -f .github/workflows/deploy.yml
          test -f .github/workflows/pr-checks.yml

      - name: PR validation completed
        run: echo "All repository checks passed."