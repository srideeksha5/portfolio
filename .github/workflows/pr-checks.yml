name: Pull Request Checks

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  pr-checks:
    name: PR Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository structure
        run: |
          test -f index.html
          test -d assets
          test -d .github/workflows

      - name: Check required workflow files
        run: |
          test -f .github/workflows/validate.yml
          test -f .github/workflows/lighthouse.yml
          test -f .github/workflows/deploy.yml
          test -f .github/workflows/pr-checks.yml

      - name: Validate workflow configuration
        run: |
          echo "All required files are present."
          echo "Pull request validation completed successfully."