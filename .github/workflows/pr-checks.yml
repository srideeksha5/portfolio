name: Pull Request Checks

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  pr-checks:
    name: PR Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v0.6.0
        with:
          root: .
          blacklist: node_modules

      - name: Check repository structure
        run: |
          test -f index.html
          test -d assets
          test -d .github/workflows

      - name: Check required workflow files
        run: |
          test -f .github/workflows/validate.yml
          test -f .github/workflows/lighthouse.yml
          test -f .github/workflows/deploy.yml